name: Validate DragMP VPS builder
on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/vps-builder/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-vps-builder.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/vps-builder/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-vps-builder.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  builder-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject source changes that reuse a published VERSION
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 scripts/guard_release_version.py
      - name: Check shell syntax and Python dependencies
        run: |
          bash -n deploy/vps-builder/*.sh
          python3 -m compileall -q scripts
      - name: Run SHA-256 release idempotency and safety checks
        run: python3 -m unittest discover -v -s tests -p 'test_*.py'

      - name: Validate live-tag package parity without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/package.py
          python3 scripts/check_existing_release.py
